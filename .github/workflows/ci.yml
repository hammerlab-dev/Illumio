name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: [self-hosted, linux, x64, lab-actions]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run repository checks
        run: scripts/check_repo.sh
